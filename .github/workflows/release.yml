name: Release

# Pushing a tag like v0.5.0 builds the Windows installer and publishes it,
# with its update packages, to the public releases repository. Running the
# workflow by hand (Actions > Release > Run workflow) only builds it, as a
# downloadable artifact, to try before releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  RELEASES_REPO: https://github.com/Trashpanda-GameDev/Git-Raccoon-Releases
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Version (from Cargo.toml; a tag must match it)
        id: version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match the version in Cargo.toml ($version)."
            exit 1
          fi

      - run: cargo build --release -p git-raccoon

      - name: Files to install
        shell: bash
        run: |
          mkdir publish
          cp target/release/git-raccoon.exe publish/

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Velopack's packaging tool
        run: dotnet tool install -g vpk

      - name: The previous release (so updates can be small deltas)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true # the first release has nothing before it
        run: vpk download github --repoUrl ${{ env.RELEASES_REPO }} --outputDir releases

      - name: Package
        run: >
          vpk pack
          --packId GitRaccoon
          --packVersion ${{ steps.version.outputs.version }}
          --packDir publish
          --mainExe git-raccoon.exe
          --packTitle "Git Raccoon"
          --packAuthors Trashpanda-GameDev
          --icon crates/git-raccoon/assets/icon.ico
          --outputDir releases

      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: git-raccoon-${{ steps.version.outputs.version }}-windows
          path: releases

      - name: Publish to the releases repository
        if: startsWith(github.ref, 'refs/tags/')
        run: >
          vpk upload github
          --repoUrl ${{ env.RELEASES_REPO }}
          --token ${{ secrets.RELEASES_TOKEN }}
          --publish
          --releaseName "Git Raccoon ${{ steps.version.outputs.version }}"
          --tag v${{ steps.version.outputs.version }}
          --outputDir releases
