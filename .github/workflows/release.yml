name: Release

# Pushing a tag like v0.5.0 builds the installers (Windows, macOS, Linux)
# and publishes them, with their update packages, as a GitHub release of
# this repository. Running the workflow by hand (Actions > Release > Run
# workflow) only builds them, as downloadable artifacts, to try first.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  RELEASES_REPO: ${{ github.server_url }}/${{ github.repository }}
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: From Cargo.toml (a tag must match it)
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "${GITHUB_REF#refs/tags/v}" != "$version" ]]; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} doesn't match the version in Cargo.toml ($version)."
            exit 1
          fi

  windows:
    name: Windows installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p git-raccoon
      - name: Files to install
        shell: bash
        run: |
          mkdir publish && cp target/release/git-raccoon.exe publish/
          cp LICENSE-MIT LICENSE-APACHE crates/git-raccoon/assets/THIRD-PARTY-NOTICES.txt publish/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk
      - name: The previous release (so updates can be small deltas)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true # the first release has nothing before it
        run: vpk download github --repoUrl ${{ env.RELEASES_REPO }} --token ${{ secrets.GITHUB_TOKEN }} --channel win --outputDir releases
      - name: Package
        run: >
          vpk pack
          --packId GitRaccoon
          --packVersion ${{ needs.version.outputs.version }}
          --runtime win-x64
          --packDir publish
          --mainExe git-raccoon.exe
          --packTitle "Git Raccoon"
          --packAuthors Trashpanda-GameDev
          --icon crates/git-raccoon/assets/icon.ico
          --splashImage crates/git-raccoon/assets/splash.png
          --channel win
          --outputDir releases
      # An installer that asks where to install (Velopack's always installs
      # to the user's AppData folder).
      - name: Installer that asks where to install
        shell: pwsh
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Try it, in a folder with a space
        shell: pwsh
        run: |
          $dir = "C:\Raccoon test\Git Raccoon"
          $p = Start-Process installer-out\GitRaccoon-win-Installer.exe -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/DIR=`"$dir`""
          $p.WaitForExit()
          Get-ChildItem -Recurse "C:\Raccoon test" | Select-Object -First 30 FullName
          if (-not (Test-Path "$dir\current\git-raccoon.exe")) { throw "Git Raccoon wasn't installed in $dir" }
          if (-not (Test-Path "$dir\Update.exe")) { throw "Velopack's updater isn't in $dir" }
          Stop-Process -Name git-raccoon -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: releases-win
          path: releases
      - uses: actions/upload-artifact@v4
        with:
          name: installer-win
          path: installer-out

  macos:
    name: macOS app (Apple Silicon)
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p git-raccoon
      - name: Files to install, and the icon in Apple's format
        run: |
          mkdir publish && cp target/release/git-raccoon publish/
          cp LICENSE-MIT LICENSE-APACHE crates/git-raccoon/assets/THIRD-PARTY-NOTICES.txt publish/
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size crates/git-raccoon/assets/icon.png --out icon.iconset/icon_${size}x${size}.png
            double=$((size * 2))
            sips -z $double $double crates/git-raccoon/assets/icon.png --out icon.iconset/icon_${size}x${size}@2x.png
          done
          iconutil -c icns icon.iconset -o icon.icns
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk
      - name: The previous release (so updates can be small deltas)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.RELEASES_REPO }} --token ${{ secrets.GITHUB_TOKEN }} --channel osx --outputDir releases
      - name: Package
        run: >
          vpk pack
          --packId GitRaccoon
          --packVersion ${{ needs.version.outputs.version }}
          --runtime osx-arm64
          --packDir publish
          --mainExe git-raccoon
          --packTitle "Git Raccoon"
          --packAuthors Trashpanda-GameDev
          --bundleId io.github.trashpanda-gamedev.git-raccoon
          --icon icon.icns
          --channel osx
          --outputDir releases
      - uses: actions/upload-artifact@v4
        with:
          name: releases-osx
          path: releases

  linux:
    name: Linux AppImage
    needs: version
    # The oldest supported Ubuntu, so the AppImage runs on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libfuse2
      - run: cargo build --release -p git-raccoon
      - name: Files to install
        run: |
          mkdir publish && cp target/release/git-raccoon publish/
          cp LICENSE-MIT LICENSE-APACHE crates/git-raccoon/assets/THIRD-PARTY-NOTICES.txt publish/
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk
      - name: The previous release (so updates can be small deltas)
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        run: vpk download github --repoUrl ${{ env.RELEASES_REPO }} --token ${{ secrets.GITHUB_TOKEN }} --channel linux --outputDir releases
      - name: Package
        run: >
          vpk pack
          --packId GitRaccoon
          --packVersion ${{ needs.version.outputs.version }}
          --runtime linux-x64
          --packDir publish
          --mainExe git-raccoon
          --packTitle "Git Raccoon"
          --packAuthors Trashpanda-GameDev
          --icon crates/git-raccoon/assets/icon.png
          --categories Development
          --channel linux
          --outputDir releases
      - uses: actions/upload-artifact@v4
        with:
          name: releases-linux
          path: releases

  publish:
    name: Publish to the releases repository
    if: startsWith(github.ref, 'refs/tags/')
    needs: [version, windows, macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release
    steps:
      - uses: actions/download-artifact@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - run: dotnet tool install -g vpk
      # One release with every platform: a draft until the last is in.
      - name: Upload
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for channel in win osx linux; do
            publish=""
            if [ "$channel" = linux ]; then publish="--publish"; fi
            vpk upload github --repoUrl "$RELEASES_REPO" --token "$TOKEN" \
              --channel "$channel" --outputDir "releases-$channel" \
              --releaseName "Git Raccoon $VERSION" --tag "v$VERSION" --merge $publish
          done
      - name: Upload the installer that asks where to install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: gh release upload "v$VERSION" installer-win/GitRaccoon-win-Installer.exe --clobber --repo "$GITHUB_REPOSITORY"
