name: Website

# Builds the project website (site/ and docs/guide.md) and publishes it on
# GitHub Pages, whenever they change on main.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/guide.md"
      - "scripts/build-site.py"
      - "crates/git-raccoon/assets/icon.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown==3.11.3
      - run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
