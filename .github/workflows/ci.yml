name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]

# A newer push to the same branch replaces a run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (lints and all tests, UI included)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: System libraries, and Mesa's software Vulkan for the UI tests
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan1 mesa-vulkan-drivers
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: mkdir -p "${{ runner.temp }}/screenshots"
      - run: cargo fmt --all --check
      - name: Third-party notices are up to date
        run: |
          python3 scripts/third-party-notices.py
          git diff --exit-code -- crates/git-raccoon/assets/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::Run python3 scripts/third-party-notices.py and commit the result."; exit 1; }
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          GIT_RACCOON_SCREENSHOTS: ${{ runner.temp }}/screenshots
      - name: Keep the UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  desktop:
    # CI machines here can't reliably draw, so the UI tests run on Linux only.
    name: ${{ matrix.os }} (build and Git tests)
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Git identity for tests that commit
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      # Lints here too: some code (the title bar's colours) is Windows-only.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --release --workspace
      - run: cargo test -p git-raccoon-core
      - run: cargo test -p git-raccoon --lib
