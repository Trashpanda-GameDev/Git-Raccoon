[workspace]
members = ["crates/*"]
default-members = ["crates/git-raccoon"]
resolver = "3"

[workspace.package]
version = "0.5.27"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Trashpanda-GameDev/Git-Raccoon"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Exceptions must use #[expect(..., reason = "...")], never a bare #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Line numbers are enough for backtraces, and keep build folders small.
[profile.dev]
debug = "line-tables-only"

# Dependencies (including libgit2, syntax highlighting and image decoding)
# are optimised even in dev builds; they are far too slow otherwise.
[profile.dev.package."*"]
opt-level = 3
debug = false

# The history walk and graph layout run on every open; keep them fast too.
[profile.dev.package.git-raccoon-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# Patched copies of the Markdown viewer, so Markdown looks right in the app
# (see vendor/README.md).
[patch.crates-io]
egui_commonmark = { path = "vendor/egui_commonmark" }
egui_commonmark_backend = { path = "vendor/egui_commonmark_backend" }
