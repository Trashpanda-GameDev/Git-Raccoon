[workspace]
members = ["crates/*"]
default-members = ["crates/git-raccoon"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Exceptions must use #[expect(..., reason = "...")], never a bare #[allow].
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Dependencies (including libgit2, syntax highlighting and image decoding)
# are optimised even in dev builds; they are far too slow otherwise.
[profile.dev.package."*"]
opt-level = 3

# The history walk and graph layout run on every open; keep them fast too.
[profile.dev.package.git-raccoon-core]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
