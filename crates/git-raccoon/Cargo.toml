[package]
name = "git-raccoon"
description = "A fast, friendly desktop Git client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
git-raccoon-core = { path = "../git-raccoon-core" }
eframe = { version = "0.36", default-features = false, features = ["accesskit", "default_fonts", "links", "persistence", "wayland", "wgpu", "x11"] }
egui-phosphor = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
rfd = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga", "tiff", "webp", "ico", "qoi"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
velopack = "1.2.161"
# Posting feedback as a GitHub issue (both already come with velopack).
ureq = "3"
# GitLab names diff lines by their file path's SHA-1.
sha1 = "0.10"
serde_json = "1"
# Forge accounts' tokens, in the system keychain.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

# Colouring the title bar to match the theme, on Windows 11.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["eframe", "snapshot", "wgpu"] }
egui = "0.36"
git2 = "0.20"
image = { version = "0.25", default-features = false, features = ["png"] }
ron = "0.12"

[lints]
workspace = true

[build-dependencies]
winresource = "0.1.34"
