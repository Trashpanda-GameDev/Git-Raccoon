[package]
name = "git-raccoon-core"
description = "Repository reading for Git Raccoon: history, graph layout, diffs, refs, search and watching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
git2 = "0.20"
notify = "8"
ssh-key = { version = "0.6", default-features = false, features = ["std", "ed25519", "encryption", "rand_core", "getrandom"] }
thiserror = "2"
trash = "5"

[lints]
workspace = true
